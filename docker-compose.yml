services:
  postgres:
    image: postgres:16-alpine
    container_name: moex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moex
    ports:
      - "5432:5432"
    volumes:
      - moex_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  moex_pg_data:
